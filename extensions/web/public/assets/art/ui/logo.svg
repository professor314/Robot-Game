<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" aria-hidden="true" role="img"><defs><filter id="logo-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8be9fd"/><stop offset="100%" stop-color="#ff92d0"/></linearGradient></defs>
  <!-- little robot mascot -->
  <rect x="18" y="34" width="54" height="46" rx="8" fill="#bd93f9" stroke="#8be9fd" stroke-width="2"/>
  <rect x="28" y="44" width="34" height="18" rx="4" fill="#0d0d1a"/>
  <circle cx="38" cy="53" r="4" fill="#ff92d0" filter="url(#logo-glow)"/>
  <circle cx="52" cy="53" r="4" fill="#8be9fd" filter="url(#logo-glow)"/>
  <line x1="45" y1="34" x2="45" y2="24" stroke="#8be9fd" stroke-width="2"/>
  <circle cx="45" cy="21" r="4" fill="#50fa7b">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <!-- wordmark -->
  <text x="92" y="66" font-family="'Space Grotesk', monospace" font-size="34" font-weight="700"
        fill="url(#logo-g)" filter="url(#logo-glow)">ROBOT-GAME</text>
  <text x="94" y="88" font-family="monospace" font-size="12" fill="#ff92d0" opacity="0.8">RESTORE THE SHIP</text>
</svg>
