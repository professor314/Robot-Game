    <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.3s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="235" r="7" fill="#fff" opacity="0.8"/>
  <!-- arms + fists -->
  <rect x="34" y="250" width="34" height="26" rx="6" fill="#0d0d1a" stroke="#ff5566" stroke-width="2"/>
  <rect x="292" y="250" width="34" height="26" rx="6" fill="#0d0d1a" stroke="#ff5566" stroke-width="2"/>
  <!-- legs -->
  <rect x="110" y="300" width="48" height="70" rx="8" fill="url(#gb1-b)" stroke="#ff5566" stroke-width="2"/>
  <rect x="202" y="300" width="48" height="70" rx="8" fill="url(#gb1-b)" stroke="#ff5566" stroke-width="2"/>
  <rect x="98" y="366" width="72" height="22" rx="6" fill="#bd93f9"/>
