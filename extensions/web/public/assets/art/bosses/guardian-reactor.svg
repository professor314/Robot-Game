  <rect x="60" y="150" width="40" height="110" rx="10" fill="#bd93f9" stroke="#ff5566" stroke-width="2"/>
  <rect x="260" y="150" width="40" height="110" rx="10" fill="#bd93f9" stroke="#ff5566" stroke-width="2"/>
