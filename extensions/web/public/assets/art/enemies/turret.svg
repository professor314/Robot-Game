<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" aria-hidden="true" role="img"><defs><filter id="en9-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="en9-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8be9fd"/><stop offset="100%" stop-color="#bd93f9"/></linearGradient></defs>
  <ellipse cx="150" cy="250" rx="80" ry="22" fill="#bd93f9" opacity="0.5"/>
  <rect x="96" y="200" width="108" height="50" rx="8" fill="url(#en9-b)" stroke="#ff5555" stroke-width="3"/>
  <!-- rotating dome -->
  <path d="M100,200 A50,50 0 0 1 200,200 Z" fill="url(#en9-b)" stroke="#ff5555" stroke-width="3"/>
  <circle cx="150" cy="190" r="16" fill="#0d0d1a" stroke="#ff5555" stroke-width="2"/>
  <circle cx="150" cy="190" r="8" fill="#ff5555" filter="url(#en9-glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.6s" repeatCount="indefinite"/></circle>
  <!-- barrel -->
  <rect x="150" y="150" width="20" height="90" rx="4" fill="#bd93f9" stroke="#ff5555" stroke-width="2"
        transform="rotate(35 160 180)"/>
  <circle cx="196" cy="150" r="9" fill="#ffb86c" filter="url(#en9-glow)"/>
</svg>
