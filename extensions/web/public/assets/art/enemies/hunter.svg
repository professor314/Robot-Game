<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" aria-hidden="true" role="img"><defs><filter id="e5-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="e5-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8be9fd"/><stop offset="100%" stop-color="#bd93f9"/></linearGradient></defs>
  <!-- nose cone -->
  <path d="M150,24 C124,56 112,96 112,120 l76,0 C188,96 176,56 150,24 Z"
        fill="url(#e5-b)" stroke="#ff5555" stroke-width="2"/>
  <circle cx="150" cy="40" r="6" fill="#ff5555" filter="url(#e5-glow)"/>
  <!-- body -->
  <rect x="104" y="120" width="92" height="120" rx="10" fill="url(#e5-b)" stroke="#ff5555" stroke-width="2"/>
  <!-- visor -->
  <rect x="116" y="134" width="68" height="20" rx="10" fill="#0d0d1a" stroke="#ff5555" stroke-width="1.5"/>
  <rect x="120" y="138" width="60" height="12" rx="6" fill="#ff5555" filter="url(#e5-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="0.7s" repeatCount="indefinite"/></rect>
  <!-- racing stripe + warning -->
  <rect x="140" y="160" width="20" height="70" fill="#ffb86c" opacity="0.6"/>
  <circle cx="150" cy="185" r="8" fill="#ff5555" filter="url(#e5-glow)"/>
  <!-- fins -->
  <path d="M104,200 l-34,30 l34,0 z" fill="#bd93f9" stroke="#ff5555" stroke-width="1"/>
  <path d="M196,200 l34,30 l-34,0 z" fill="#bd93f9" stroke="#ff5555" stroke-width="1"/>
  <!-- exhaust -->
  <path d="M126,240 l48,0 l-10,44 l-28,0 z" fill="#ffb86c" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.3s" repeatCount="indefinite"/></path>
  <path d="M138,240 l24,0 l-6,60 l-12,0 z" fill="#ff5555" opacity="0.7"/>
</svg>
