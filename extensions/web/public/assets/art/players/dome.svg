<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" aria-hidden="true" role="img">
  <defs>
    <radialGradient id="r01-dome" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8be9fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="r01-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="r01-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
  </defs>

  <!-- Antenna -->
  <line x1="150" y1="55" x2="150" y2="20" stroke="#bd93f9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="150" cy="14" r="7" fill="#50fa7b" filter="url(#r01-glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Dome head -->
  <ellipse cx="150" cy="100" rx="60" ry="50" fill="url(#r01-dome)" stroke="#8be9fd" stroke-width="2"/>
  <!-- Glass reflection -->
  <ellipse cx="135" cy="80" rx="20" ry="10" fill="#fff" opacity="0.15" transform="rotate(-15 135 80)"/>

  <!-- Eyes -->
  <circle cx="130" cy="100" r="10" fill="#0d0d1a"/>
  <circle cx="130" cy="100" r="7" fill="#ff92d0" filter="url(#r01-glow)"/>
  <circle cx="128" cy="98" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="170" cy="100" r="10" fill="#0d0d1a"/>
  <circle cx="170" cy="100" r="7" fill="#ff92d0" filter="url(#r01-glow)"/>
  <circle cx="168" cy="98" r="3" fill="#fff" opacity="0.7"/>

  <!-- Mouth grille -->
  <rect x="135" y="115" width="30" height="10" rx="2" fill="#0d0d1a" stroke="#bd93f9" stroke-width="1"/>
  <line x1="140" y1="115" x2="140" y2="125" stroke="#bd93f9" stroke-width="0.5"/>
  <line x1="145" y1="115" x2="145" y2="125" stroke="#bd93f9" stroke-width="0.5"/>
  <line x1="150" y1="115" x2="150" y2="125" stroke="#bd93f9" stroke-width="0.5"/>
  <line x1="155" y1="115" x2="155" y2="125" stroke="#bd93f9" stroke-width="0.5"/>
  <line x1="160" y1="115" x2="160" y2="125" stroke="#bd93f9" stroke-width="0.5"/>

  <!-- Neck -->
  <rect x="140" y="145" width="20" height="15" rx="3" fill="#bd93f9"/>

  <!-- Body -->
  <rect x="95" y="160" width="110" height="120" rx="8" fill="url(#r01-body)" stroke="#8be9fd" stroke-width="2"/>
  <!-- Chest panel -->
  <rect x="110" y="175" width="80" height="50" rx="4" fill="#0d0d1a" stroke="#bd93f9" stroke-width="1.5"/>
  <!-- Panel dials -->
  <circle cx="130" cy="195" r="8" fill="#0d0d1a" stroke="#ff92d0" stroke-width="1.5"/>
  <circle cx="130" cy="195" r="3" fill="#ff92d0" opacity="0.6"/>
  <circle cx="155" cy="195" r="8" fill="#0d0d1a" stroke="#50fa7b" stroke-width="1.5"/>
  <circle cx="155" cy="195" r="3" fill="#50fa7b" opacity="0.6"/>
  <circle cx="175" cy="195" r="5" fill="#ffb86c" filter="url(#r01-glow)" opacity="0.8"/>
  <!-- Panel lines -->
  <line x1="115" y1="210" x2="185" y2="210" stroke="#bd93f9" stroke-width="0.5" opacity="0.5"/>
  <rect x="120" y="215" width="15" height="5" rx="1" fill="#50fa7b" opacity="0.4"/>
  <rect x="140" y="215" width="15" height="5" rx="1" fill="#ff92d0" opacity="0.4"/>
  <rect x="160" y="215" width="15" height="5" rx="1" fill="#ffb86c" opacity="0.4"/>

  <!-- Rivets on body -->
  <circle cx="102" cy="168" r="3" fill="#bd93f9" opacity="0.6"/>
  <circle cx="198" cy="168" r="3" fill="#bd93f9" opacity="0.6"/>
  <circle cx="102" cy="272" r="3" fill="#bd93f9" opacity="0.6"/>
  <circle cx="198" cy="272" r="3" fill="#bd93f9" opacity="0.6"/>

  <!-- Belt -->
  <rect x="95" y="255" width="110" height="10" rx="2" fill="#bd93f9" opacity="0.5"/>
  <circle cx="150" cy="260" r="5" fill="#ffb86c"/>

  <!-- Left arm (at side) -->
  <rect x="60" y="170" width="30" height="14" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <rect x="50" y="180" width="18" height="60" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <rect x="48" y="235" width="22" height="16" rx="4" fill="#bd93f9"/>

  <!-- Right arm (raised waving) -->
  <rect x="210" y="170" width="30" height="14" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <rect x="225" y="120" width="18" height="60" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="1" transform="rotate(15 234 150)"/>
  <!-- Hand waving -->
  <g transform="translate(248, 105) rotate(15)">
    <rect x="-10" y="-8" width="22" height="16" rx="4" fill="#bd93f9"/>
    <rect x="8" y="-10" width="5" height="8" rx="2" fill="#ff92d0"/>
    <rect x="2" y="-12" width="5" height="8" rx="2" fill="#ff92d0"/>
    <rect x="-4" y="-10" width="5" height="8" rx="2" fill="#ff92d0"/>
  </g>

  <!-- Legs -->
  <rect x="115" y="280" width="25" height="55" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <rect x="160" y="280" width="25" height="55" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <!-- Feet -->
  <rect x="108" y="330" width="38" height="16" rx="6" fill="#bd93f9"/>
  <rect x="153" y="330" width="38" height="16" rx="6" fill="#bd93f9"/>

  <!-- Knee joints -->
  <circle cx="127" cy="305" r="5" fill="#0d0d1a" stroke="#bd93f9" stroke-width="1"/>
  <circle cx="172" cy="305" r="5" fill="#0d0d1a" stroke="#bd93f9" stroke-width="1"/>
</svg>
