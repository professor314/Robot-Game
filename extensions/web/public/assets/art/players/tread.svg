<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="r05-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <filter id="r05-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="r05-tread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8be9fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Periscope / antenna -->
  <line x1="150" y1="40" x2="150" y2="15" stroke="#bd93f9" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="143" y="8" width="14" height="10" rx="2" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <circle cx="157" cy="13" r="4" fill="#ff92d0" filter="url(#r05-glow)"/>

  <!-- Head â€” boxy with single large eye -->
  <rect x="115" y="40" width="70" height="50" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="2"/>
  <!-- Single large cyclops eye -->
  <circle cx="150" cy="62" r="18" fill="#0d0d1a" stroke="#ff92d0" stroke-width="2"/>
  <circle cx="150" cy="62" r="13" fill="#ff92d0" filter="url(#r05-glow)" opacity="0.8"/>
  <circle cx="150" cy="62" r="7" fill="#0d0d1a"/>
  <circle cx="150" cy="62" r="4" fill="#ff92d0">
    <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="56" r="4" fill="#fff" opacity="0.5"/>
  <!-- Eye ring detail -->
  <circle cx="150" cy="62" r="20" fill="none" stroke="#bd93f9" stroke-width="0.5" opacity="0.4"/>

  <!-- Neck â€” short thick -->
  <rect x="130" y="90" width="40" height="15" rx="4" fill="#bd93f9"/>

  <!-- Body â€” wide boxy -->
  <rect x="80" y="105" width="140" height="100" rx="8" fill="url(#r05-body)" stroke="#8be9fd" stroke-width="2"/>

  <!-- Chest panel -->
  <rect x="95" y="115" width="110" height="40" rx="4" fill="#0d0d1a" stroke="#bd93f9" stroke-width="1.5"/>
  <!-- Readout screen -->
  <rect x="105" y="120" width="50" height="28" rx="3" fill="#0d0d1a" stroke="#50fa7b" stroke-width="1"/>
  <text x="130" y="138" text-anchor="middle" fill="#50fa7b" font-family="monospace" font-size="9" opacity="0.8">TREAD:OK</text>
  <!-- Status lights -->
  <circle cx="170" cy="128" r="4" fill="#50fa7b" filter="url(#r05-glow)"/>
  <circle cx="182" cy="128" r="4" fill="#ffb86c" filter="url(#r05-glow)"/>
  <circle cx="194" cy="128" r="4" fill="#ff92d0" opacity="0.4"/>
  <!-- Vent slits -->
  <line x1="100" y1="160" x2="200" y2="160" stroke="#0d0d1a" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="165" x2="200" y2="165" stroke="#0d0d1a" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="170" x2="200" y2="170" stroke="#0d0d1a" stroke-width="1" opacity="0.5"/>

  <!-- Belly hatch -->
  <rect x="120" y="178" width="60" height="20" rx="3" fill="#0d0d1a" stroke="#bd93f9" stroke-width="1"/>
  <circle cx="150" cy="188" r="4" fill="#bd93f9" opacity="0.5"/>

  <!-- Rivets -->
  <circle cx="88" cy="112" r="3" fill="#bd93f9" opacity="0.6"/>
  <circle cx="212" cy="112" r="3" fill="#bd93f9" opacity="0.6"/>
  <circle cx="88" cy="198" r="3" fill="#bd93f9" opacity="0.6"/>
  <circle cx="212" cy="198" r="3" fill="#bd93f9" opacity="0.6"/>

  <!-- Utility left arm â€” with tool -->
  <rect x="48" y="115" width="28" height="12" rx="4" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <rect x="42" y="123" width="16" height="50" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <circle cx="50" cy="148" r="4" fill="#0d0d1a" stroke="#bd93f9" stroke-width="1"/>
  <!-- Wrench tool -->
  <rect x="44" y="170" width="12" height="25" rx="2" fill="#bd93f9"/>
  <circle cx="50" cy="198" r="8" fill="none" stroke="#ffb86c" stroke-width="2.5"/>

  <!-- Utility right arm â€” with claw -->
  <rect x="224" y="115" width="28" height="12" rx="4" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <rect x="242" y="123" width="16" height="50" rx="5" fill="#8be9fd" stroke="#bd93f9" stroke-width="1"/>
  <circle cx="250" cy="148" r="4" fill="#0d0d1a" stroke="#bd93f9" stroke-width="1"/>
  <!-- Pincer -->
  <path d="M244,175 L240,195 L248,195 Z" fill="#bd93f9" stroke="#8be9fd" stroke-width="1"/>
  <path d="M256,175 L260,195 L252,195 Z" fill="#bd93f9" stroke="#8be9fd" stroke-width="1"/>

  <!-- Tank treads â€” left -->
  <rect x="65" y="210" width="55" height="55" rx="20" fill="none" stroke="url(#r05-tread)" stroke-width="8"/>
  <!-- Tread wheels -->
  <circle cx="85" cy="218" r="8" fill="#0d0d1a" stroke="#bd93f9" stroke-width="2"/>
  <circle cx="85" cy="218" r="3" fill="#bd93f9"/>
  <circle cx="85" cy="252" r="8" fill="#0d0d1a" stroke="#bd93f9" stroke-width="2"/>
  <circle cx="85" cy="252" r="3" fill="#bd93f9"/>
  <!-- Tread segments -->
  <line x1="68" y1="225" x2="68" y2="245" stroke="#bd93f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="73" y1="225" x2="73" y2="245" stroke="#bd93f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="97" y1="225" x2="97" y2="245" stroke="#bd93f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="102" y1="225" x2="102" y2="245" stroke="#bd93f9" stroke-width="1.5" opacity="0.4"/>

  <!-- Tank treads â€” right -->
  <rect x="180" y="210" width="55" height="55" rx="20" fill="none" stroke="url(#r05-tread)" stroke-width="8"/>
  <circle cx="215" cy="218" r="8" fill="#0d0d1a" stroke="#bd93f9" stroke-width="2"/>
  <circle cx="215" cy="218" r="3" fill="#bd93f9"/>
  <circle cx="215" cy="252" r="8" fill="#0d0d1a" stroke="#bd93f9" stroke-width="2"/>
  <circle cx="215" cy="252" r="3" fill="#bd93f9"/>
  <line x1="183" y1="225" x2="183" y2="245" stroke="#bd93f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="188" y1="225" x2="188" y2="245" stroke="#bd93f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="212" y1="225" x2="212" y2="245" stroke="#bd93f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="217" y1="225" x2="217" y2="245" stroke="#bd93f9" stroke-width="1.5" opacity="0.4"/>

  <!-- Tread connecting bar -->
  <rect x="115" y="230" width="70" height="12" rx="3" fill="#bd93f9" opacity="0.5"/>
</svg>
